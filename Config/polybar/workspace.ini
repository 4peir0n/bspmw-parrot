[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor =
monitor-fallback =
monitor-strict = false
fixed-center = true
width = 50%
height = 35
offset-x = 25%
offset-y = 5
background = ${color.bg}
foreground = ${color.fg}
radius-top = 10.0
radius-bottom = 10.0
line-size = 0
line-color = ${color.ac}
border-size = 1
border-top-size = 2
border-color = ${color.ac}
padding = 2
module-margin-left = 1
module-margin-right = 1
font-0 = "Iosevka Nerd Font:size=18;5"
font-1 = "Iosevka Nerd Font:size=12;2"
font-2 = "Iosevka Nerd Font:bold:size=24;2"
dim-value = 1.0
wm-name = openbox
locale =
tray-position = none
tray-detached = false
tray-maxsize = 16
tray-transparent = false
tray-background = ${color.bg}
tray-offset-x = 0
tray-offset-y = 0
tray-padding = 0
tray-scale = 1.0
wm-restack = bspwm
enable-ipc = true
cursor-click =
cursor-scroll =

[settings]
throttle-output = 5
throttle-output-for = 10
throttle-input-for = 30
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false

[bar/primary]
inherit = bar/main
override-redirect = true
wm-restack = bspwm
width = 390px
offset-x = 20px
offset-y = 15
height = 35
bottom = false
padding = 0
module-margin-left = 0
module-margin-right = 0
modules-center = workspaces

separator =
spacing = 0

[module/workspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true

icon-0 = 1;
icon-1 = 2;
icon-2 = 3;
icon-3 = 4;
icon-4 = 5;
icon-5 = 6;
icon-6 = 7;
icon-7 = 8;
icon-8 = 9;
icon-9 = 10;
icon-default = ∙
format = <label-state>
format-padding = 0

label-active = "  "
label-active-foreground = ${color.fg}
label-active-background = ${color.bg}

label-occupied = "  "
label-occupied-foreground = ${color.ghost}
label-occupied-background = ${color.bg}

label-urgent = "%icon% "
label-urgent-foreground = ${color.red}
label-urgent-background = ${color.bg}

label-empty = "  "
label-empty-foreground = ${color.muted}
label-empty-background = ${color.bg}

[module/title]
type = internal/xwindow
format = <label>
format-foreground = ${color.fg}
format-font = 2
label = %title%
label-maxlen = 20
label-empty = Desktop
