[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor =
monitor-fallback =
monitor-strict = false
bottom = true
fixed-center = true
width = 17%
height = 30
offset-x = 20
offset-y = 20
background = ${color.bg}
foreground = ${color.fg}
radius-top = 10.0
radius-bottom = 10.0
line-size = 0
line-color = ${color.ac}
border-size = 1
border-top-size = 2
border-bottom-size = 1
border-color = ${color.ac}
padding = 2
module-margin-left = 1
module-margin-right = 1
font-0 = "Iosevka Nerd Font:size=13;3"
font-1 = "Iosevka Nerd Font:bold:size=24;2"
font-2 = "Iosevka Nerd Font:size=22;6"
font-3 = "Source Code Pro:size=10;3"
font-4 = "Hack Nerd Font:size=16;4"
font-5 = "Hack Nerd Font Mono:style=medium:pixelsize=27;5"
font-6 = "Iosevka Nerd Font:size=28;5"
dim-value = 1.0
wm-name = openbox
locale =
tray-position = none
tray-detached = false
tray-maxsize = 16
tray-transparent = false
tray-background = ${color.bg}
tray-offset-x = 0
tray-offset-y = 0
tray-padding = 0
tray-scale = 1.0
wm-restack = bspwm
enable-ipc = true
click-left =
click-middle =
click-right =
scroll-up =
scroll-down =
double-click-left =
double-click-middle =
double-click-right =
cursor-click =
cursor-scroll =

[settings]
throttle-output = 5
throttle-output-for = 10
throttle-input-for = 30
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
format-foreground =
format-background =
format-underline =
format-overline =
format-spacing = 0
format-padding = 0
format-margin = 0
format-offset = 0
pseudo-transparency = false

[bar/log]
inherit = bar/main
width = 3.1%
height = 35
offset-x = 1%
offset-y = 15
bottom = false
foreground = ${color.fg}
background = ${color.bg}
padding = 0
modules-center = my-text-label
wm-restack = bspwm

[bar/system]
inherit = bar/main
width = 22%
height = 35
offset-x = 77%
offset-y = 15
bottom = false
background = ${color.bg}
foreground = ${color.fg}
padding = 0
module-margin-left = 0
module-margin-right = 0
modules-left =
modules-center =
modules-right =
wm-restack = bspwm

separator =
spacing = 0

[bar/htb]
inherit = bar/main
width = 200px
height = 35
offset-x = 1440px
offset-y = 15
bottom = false
modules-center = htb_status
wm-restack = bspwm

[bar/target]
inherit = bar/main
width = 250px
height = 35
offset-x = 1650px
offset-y = 15
bottom = false
modules-center = htb_target
wm-restack = bspwm

[module/my-text-label]
type = custom/text
content = %{T6}󰥺
click-left  = ~/.config/rofi/bin/launcher &

[module/mpd]
type = internal/mpd
interval = 2
format-online = <label-song>
format-online-foreground = ${color.fg}
label-song = "%title%"
label-song-maxlen = 12
label-song-ellipsis = true
label-offline = "Offline"

[module/ethernet_status]
type = custom/script
interval = 5
exec = ~/.config/bin/ethernet_status.sh

[module/htb_status]
type = custom/script
interval = 5
exec = ~/.config/bin/hackthebox_status.sh

[module/htb_target]
type = custom/script
interval = 5
exec = ~/.config/bin/target_hack.sh

[module/date]
type = internal/date
interval = 5
date = %H:%M
date-alt = %Y-%m-%d
label = %date%
label-foreground = ${color.fg}

[module/alsa]
type = internal/alsa
format-volume = <ramp-volume>
format-volume-foreground = ${color.fg}
label-muted =   muted
label-muted-foreground = ${color.red}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
