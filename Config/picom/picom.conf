corner-radius = 12;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'firefox'",
];

round-borders = 12;
round-borders-exclude = [];

shadow = true
shadow-radius = 6
shadow-opacity = .3
shadow-offset-x = -5
shadow-offset-y = -5

shadow-exclude = [
    "class_g = 'firefox' && argb",
    "class_g = 'Polybar'",
    "class_g = 'kitty'",
];

fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

inactive-opacity = 1.0
frame-opacity = 1.0
opacity = 1.0
inactive-opacity-override = false
active-opacity = 1.0
focus-exclude = [ "class_g = 'Cairo-clock'" ];

blur-background = false

backend = "xrender"
vsync = false

glx-no-stencil = true
glx-no-rebind-pixmap = true
use-damage = true
frame-dropping = true
unredir-if-possible = true
unredir-if-possible-delay = 250

mark-wmwin-focused = true
mark-ovredir-focused = true
detect-rounded-corners = true
detect-client-opacity = true
detect-transient = true
detect-client-leader = true

log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; shadow-radius = 0; shadow-opacity = 0.5; shadow-offset-x = -10; shadow-offset-y = -10; opacity = 0.85; full-shadow = true; };
  dnd = { shadow = false; }
  dropdown_menu = { shadow = false; };
  popup_menu    = { shadow = false; };
  utility       = { shadow = false; };
}
